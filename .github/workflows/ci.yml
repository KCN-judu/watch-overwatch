# Checks the code on every pull request and every push to main: the Rust service and
# core (format, lints, tests) and the Flutter app (format, analyzer, tests). On a
# version tag it also builds the release package and attaches it to the GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'site/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'site/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.44.7

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, so a new Rust release (with new clippy lints) never fails CI by surprise.
      # Bump it on purpose, once `cargo +<version> clippy --all-targets` passes locally.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  flutter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, flutter]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cargo build --release -p watchd
      - run: flutter build windows --release
        working-directory: app
      - run: cargo xtask package
      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "见 CHANGELOG.md"
          gh release upload "$tag" dist/*.zip dist/*.sha256 --clobber
